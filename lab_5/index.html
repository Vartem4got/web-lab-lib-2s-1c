<!DOCTYPE html>
<html lang="us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    <style>
        :root {
            --primary-blue: #0938d1; /*#689fda*/
            --danger-red: #c31a2b;
            --light-bg: #ffffff;
            --border-color: #dee2e6;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #fff; color: #333; }
        
        /* Навігація */
        header { display: flex; border-bottom: 1px solid var(--border-color); background: #fff; }
        .nav-item { padding: 15px 25px; cursor: pointer; border-right: 1px solid var(--border-color); text-decoration: none; color: #666; }
        .nav-item.active { background-color: #e9ecef; font-weight: bold; color: #000; }
        .nav-item:hover { background-color: #f1f1f1; }

        /* Пошук */
        .search-container { padding: 10px 20px; display: flex; justify-content: flex-end; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .search-container input { width: 300px; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; }
        .btn-search { background: #fff; border: 1px solid var(--primary-blue); color: var(--primary-blue); padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        .btn-clear { background: #fff; border: 1px solid var(--danger-red); color: var(--danger-red); padding: 8px 20px; border-radius: 4px; cursor: pointer; }

        /* Лейаут */
        .main-layout { display: flex; min-height: calc(100vh - 120px); }
        
        .sidebar { width: 280px; padding: 30px 20px; border-right: 1px solid var(--border-color); }
        .control-group { margin-bottom: 40px; }
        
        /* Перемикач */
        .switch-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        .count-btn { background: var(--primary-blue); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }

        /* Картки */
        .content-grid { flex-grow: 1; padding: 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; align-content: flex-start; }
        .hotel-card { border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; background: #fff; transition: transform 0.2s; }
        .hotel-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hotel-img-placeholder { height: 160px; background: #eee; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #aaa; }
        .hotel-info { padding: 15px; flex-grow: 1; }
        .hotel-info h3 { margin: 0 0 10px 0; }
        .hotel-actions { display: flex; gap: 10px; padding: 15px; border-top: 1px solid #eee; }
        .btn-edit { background: #5bc0de; color: white; border: none; padding: 8px; flex: 1; border-radius: 4px; cursor: pointer; }
        .btn-remove { background: #d9534f; color: white; border: none; padding: 8px; flex: 1; border-radius: 4px; cursor: pointer; }

        /* Форми */
        #create-page, #edit-page { display: none; padding: 50px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: var(--primary-blue); color: white; border: none; width: 100%; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="nav-item">Cataloge</div>
        <div class="nav-item active" id="nav-list" onclick="showPage('list')">My Hotels</div>
        <div class="nav-item" id="nav-create" onclick="showPage('create')">Create Hotel</div>
    </header>

    <div id="search-bar-ui" class="search-container">
        <input type="text" id="searchInput" placeholder="Search by name...">
        <button class="btn-search" onclick="handleSearch()">Search</button>
        <button class="btn-clear" onclick="clearSearch()">Clear</button>
    </div>

    <div id="list-page" class="main-layout">
        <aside class="sidebar">
            <h2>Manage hotels</h2>
            <div class="control-group">
                <div class="switch-container">
                    <span>Sort by rooms (max)</span>
                    <label class="switch">
                        <input type="checkbox" id="sortToggle" onchange="toggleSort()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="control-group">
                <p>Count total rooms:</p>
                <button class="count-btn" onclick="calculateTotal()">Count</button>
                <div style="margin-top: 15px;">Total: <span id="totalDisplay" style="font-weight: bold;">0</span></div>
            </div>
        </aside>
        <main class="content-grid" id="hotelGrid"></main>
    </div>

    <div id="create-page">
        <h1 style="text-align: center;">Create new hotel</h1>
        <div class="form-group"><label>Title</label><input type="text" id="hotelTitle" placeholder="Hotel name..."></div>
        <div class="form-group"><label>Description</label><textarea id="hotelDesc" rows="4" placeholder="Description..."></textarea></div>
        <div class="form-group"><label>Rooms Count</label><input type="number" id="hotelRooms" value="10"></div>
        <div class="form-group">
            <label>Hotel Type</label>
            <select id="hotelType">
                <option value="Resort">Resort</option>
                <option value="Business">Business</option>
                <option value="Boutique">Boutique</option>
            </select>
        </div>
        <button class="btn-submit" onclick="submitHotel()">Submit</button>
    </div>

    <div id="edit-page">
        <h1 style="text-align: center;">Edit hotel</h1>
        <input type="hidden" id="editHotelId">
        <div class="form-group"><label>Title</label><input type="text" id="editHotelTitle"></div>
        <div class="form-group"><label>Description</label><textarea id="editHotelDesc" rows="4"></textarea></div>
        <div class="form-group"><label>Rooms Count</label><input type="number" id="editHotelRooms"></div>
        <div class="form-group">
            <label>Hotel Type</label>
            <select id="editHotelType">
                <option value="Resort">Resort</option>
                <option value="Business">Business</option>
                <option value="Boutique">Boutique</option>
            </select>
        </div>
        <button class="btn-submit" onclick="updateHotel()">Save Changes</button>
    </div>

    <script>
    const API_URL = 'http://localhost:5000/api/hotels';

    // 1. Автоматичне завантаження при відкритті сторінки
    window.onload = loadHotels;

    // 2. Функція перемикання сторінок (щоб бачити форму створення)
    function showPage(page) {
        document.getElementById('list-page').style.display = page === 'list' ? 'flex' : 'none';
        document.getElementById('search-bar-ui').style.display = page === 'list' ? 'flex' : 'none';
        document.getElementById('create-page').style.display = page === 'create' ? 'block' : 'none';
        document.getElementById('edit-page').style.display = page === 'edit' ? 'block' : 'none';
        
        // Оновлюємо активний клас у навігації
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (page === 'list') {
            document.getElementById('nav-list').classList.add('active');
            loadHotels();
        } else if (page === 'create') {
            document.getElementById('nav-create').classList.add('active');
        }
    }

    // 3. Головна функція завантаження (Пошук + Сортування)
    async function loadHotels() {
        const searchTerm = document.getElementById('searchInput').value;
        const isSortEnabled = document.getElementById('sortToggle').checked;
        let url = `${API_URL}?search=${encodeURIComponent(searchTerm)}`;
        if (isSortEnabled) url += `&sort=desc`;

        try {
            const response = await fetch(url);
            const hotels = await response.json();
            renderHotels(hotels); 
        } catch (e) {
            console.error("Сервер недоступний");
            document.getElementById('hotelGrid').innerHTML = '<p style="color:red">Помилка: сервер не відповідає (запустіть app.py)</p>';
        }
    }

    // 4. РЕНДЕРИНГ (Малювання карток) — ЦЬОГО НЕ ВИСТАЧАЛО
    function renderHotels(hotels) {
        const grid = document.getElementById('hotelGrid');
        grid.innerHTML = '';
        
        if (hotels.length === 0) {
            grid.innerHTML = '<p>Готелів не знайдено</p>';
            return;
        }

        hotels.forEach(h => {
            const card = document.createElement('div');
            card.className = 'hotel-card';
            card.innerHTML = `
                <div class="hotel-img-placeholder">IMAGE</div>
                <div class="hotel-info">
                    <h3>${h.title}</h3>
                    <p>${h.desc}</p>
                    <p>Rooms: ${h.rooms} | Type: ${h.type}</p>
                </div>
                <div class="hotel-actions">
                    <button class="btn-edit">Edit</button>
                    <button class="btn-remove">Remove</button>
                </div>`;
            grid.appendChild(card);
        });
    }

    // 5. СТВОРЕННЯ ГОТЕЛЮ — ЦЬОГО НЕ ВИСТАЧАЛО
    async function submitHotel() {
        const title = document.getElementById('hotelTitle').value;
        const desc = document.getElementById('hotelDesc').value;
        const rooms = document.getElementById('hotelRooms').value;
        const type = document.getElementById('hotelType').value;

        if (!title || !desc) {
            alert("Заповніть назву та опис!");
            return;
        }

        const newHotel = {
            id: Date.now(), // Тимчасовий ID
            title: title,
            desc: desc,
            rooms: parseInt(rooms),
            type: type
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newHotel)
            });

            if (response.ok) {
                // Очищуємо поля
                document.getElementById('hotelTitle').value = '';
                document.getElementById('hotelDesc').value = '';
                // Повертаємось на головну
                showPage('list');
            }
        } catch (e) {
            alert("Не вдалося зберегти готель");
        }
    }

    // Логіка кнопок пошуку
    function handleSearch() { loadHotels(); }
    function clearSearch() { 
        document.getElementById('searchInput').value = ''; 
        loadHotels(); 
    }
    function toggleSort() { loadHotels(); }

    // ПІДРАХУНОК
    async function calculateTotal() {
        const searchTerm = document.getElementById('searchInput').value;
        const url = `${API_URL}/count?search=${encodeURIComponent(searchTerm)}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById('totalDisplay').innerText = data.total;
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
